name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "sdk.dir=$ANDROID_SDK_ROOT" > app/local.properties
        ls $ANDROID_SDK_ROOT
    
    - name: Download Gradle 7.5
      run: |
        wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
        unzip -q gradle-7.5-bin.zip
        chmod +x gradle-7.5/bin/gradle
    
    - name: Build APK
      run: gradle-7.5/bin/gradle assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quality-app-debug
        path: app/build/outputs/apk/debug/*.apk
